[package]
name = "opencode-stats"
version = "0.1.9"
description = "Lightweight desktop dashboard for OpenCode token usage and costs"
authors = ["terzastella"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opencode_stats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# NOTE: tauri-build tracks its own 2.x line (latest 2.7.0); the GHSA-7gmj-67g7-phm9
# floor below applies to the `tauri` crate only, which is on the 2.11.x line.
tauri-build = { version = "2", features = [] }

[dependencies]
# Caret floor guards GHSA-7gmj-67g7-phm9 (tauri <=2.11.0, fixed in 2.11.1).
tauri = { version = "2.11.1", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# NOTE: no panic="abort" on purpose: a backend panic must surface as an
# invoke error, never as a silent process death.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
