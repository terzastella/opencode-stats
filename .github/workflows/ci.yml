name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no job needs to write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # tsc && vite build — typecheck is part of the build, no extra step needed.
      - run: npm run build

  tauri:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      # Rust unit tests run here (windows): compiling the Tauri lib on
      # Linux would need system GTK dev packages that CI doesn't install.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: npm run tauri build

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Frontend unit tests (vitest) only — Rust tests live in the
      # windows `tauri` job (needs no extra system dependencies there).
      - run: npm test

# NOTE: CI is a gate only — no artifacts are uploaded. Public releases are
# built locally with scripts/build-release.ps1, which scrubs build-machine
# paths from the binary via --remap-path-prefix.
