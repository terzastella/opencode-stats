name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # tsc && vite build — typecheck is part of the build, no extra step needed.
      - run: npm run build

  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build

# NOTE: CI is a gate only — no artifacts are uploaded. Public releases are
# built locally with scripts/build-release.ps1, which scrubs build-machine
# paths from the binary via --remap-path-prefix.
